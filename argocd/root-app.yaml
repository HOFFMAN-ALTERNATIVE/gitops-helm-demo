# Bootstrap: `kubectl apply -n argocd -f argocd/root-app.yaml` — everything else is pulled from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/HOFFMAN-ALTERNATIVE/gitops-helm-demo.git
    targetRevision: main
    path: argocd/apps
    helm:
      parameters:
        - name: revision
          value: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
